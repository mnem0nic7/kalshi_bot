x-build: &build
  image: ${KALSHI_BOT_IMAGE:-kalshi-bot:local}
  build:
    context: ..
    dockerfile: infra/docker/Dockerfile

# 50/50 physical-core split (8 cores, hyperthreaded as sibling pairs n & n+8):
# prod gets cores 0-3 (CPUs 0-3,8-11), the dedicated trainer gets cores 4-7
# (CPUs 4-7,12-15). Keeps the live system isolated from training compute.
x-cpu-limits: &cpu-limits
  cpuset: "0-3,8-11"

x-cpu-trainer: &cpu-trainer
  cpuset: "4-7,12-15"

x-gpu-access: &gpu-access
  gpus: ${KALSHI_BOT_GPUS:-all}

# OOM guardrail: the live trading stack (apps, daemons, Postgres) must never be
# the kernel's victim under HOST-level memory pressure. A strongly negative
# oom_score_adj makes the kernel reap default-priority processes first — stray
# host-level analysis jobs (adj 0) and the trainer (adj +500, set on its block)
# die before any trading container. This is the durable fix for the 2026-06-14
# host-OOM incident; mem_limit alone only governs per-cgroup OOM, not host-wide.
x-oom-protect: &oom-protect
  oom_score_adj: -900

