    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=30).read()"]
    interval: 60s
    timeout: 60s
    retries: 3
    start_period: 90s
  restart: unless-stopped

