  web_demo:
    <<: *demo-app-base
    environment:
      <<: *demo-web-env
      APP_COLOR: ${WEB_DEMO_APP_COLOR:-${WEB_APP_COLOR:-blue}}
      KALSHI_ENV: demo
      WEB_SITE_KIND: demo

  web_production:
    <<: *production-app-base
    environment:
      <<: *production-web-env
      APP_COLOR: ${WEB_PRODUCTION_APP_COLOR:-${WEB_APP_COLOR:-blue}}
      KALSHI_ENV: production
      WEB_SITE_KIND: production

  web_strategies:
    <<: *demo-app-base
    environment:
      <<: *demo-web-env
      APP_COLOR: ${WEB_STRATEGIES_APP_COLOR:-${WEB_DEMO_APP_COLOR:-${WEB_APP_COLOR:-blue}}}
      KALSHI_ENV: demo
      WEB_SITE_KIND: strategies
      POSTGRES_SECONDARY_HOST: postgres_production
    depends_on:
      postgres_demo:
        condition: service_healthy
      postgres_production:
        condition: service_healthy

  caddy:
    <<: *cpu-limits
    image: caddy:2.9-alpine
    env_file: [../.env]
    environment:
      WEB_PUBLIC_HOST: ${WEB_PUBLIC_HOST:-home.kb-trade.trade}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-m7.ga.77@gmail.com}
    depends_on:
      - web_production
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_demo_data:
  postgres_production_data:
  caddy_data:
  caddy_config:
  training_data:
