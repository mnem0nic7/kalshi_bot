      CRYPTO_CURRENT_15M_INTERVAL_SECONDS: ${CRYPTO_CURRENT_15M_INTERVAL_SECONDS:-0}

  crypto_current_1h_production:
    <<: *production-daemon-base
    command:
      - bash
      - -lc
      - |
        cycle=0
        while true; do
          cycle=$((cycle + 1))
          assets="$${CRYPTO_CURRENT_1H_ASSETS:-$${PRODUCTION_CRYPTO_CURRENT_1H_ASSETS:-BTC,HYPE,ETH,BNB,SOL,DOGE,XRP}}"
          assets="$${assets//,/ }"
          echo "starting 1h current quote-path collection" >&2
          if ! kalshi-bot-cli crypto-history collect-open \
            --kalshi-env production \
            --frequency 1h \
            --assets $$assets \
            --json; then
            echo "1h current quote collection failed" >&2
          fi
          if ! kalshi-bot-cli crypto-spot collect-current \
            --kalshi-env production \
            --frequency 1h \
            --assets $$assets \
            --json; then
            echo "1h current spot collection failed" >&2
          fi
          settled_every="$${CRYPTO_1H_CURRENT_SETTLED_EVERY_CYCLES:-0}"
          if [[ "$$settled_every" =~ ^[0-9]+$ ]] && (( settled_every > 0 )) && { (( cycle == 1 )) || (( cycle % settled_every == 0 )); }; then
            settled_label_args=""
            if [[ "$${CRYPTO_1H_CURRENT_SETTLED_LABEL_PROPAGATION_ENABLED:-false}" != "true" ]]; then
              settled_label_args="--skip-label-propagation"
            fi
            if ! kalshi-bot-cli crypto-history collect-settled \
              --kalshi-env production \
              --frequency 1h \
              --assets $$assets \
              --days "$${CRYPTO_1H_CURRENT_SETTLED_DAYS:-2}" \
              --skip-candles \
              --skip-quality \
              $$settled_label_args \
              --json; then
              echo "1h settlement label propagation failed" >&2
            fi
          fi
          replay_gate_enabled="$${CRYPTO_1H_CURRENT_REPLAY_GATE_ENABLED:-false}"
          replay_gate_every="$${CRYPTO_1H_CURRENT_REPLAY_GATE_EVERY_CYCLES:-80}"
          if [[ "$$replay_gate_enabled" == "true" ]] && [[ "$$replay_gate_every" =~ ^[0-9]+$ ]] && (( replay_gate_every > 0 )) && { (( cycle == 1 )) || (( cycle % replay_gate_every == 0 )); }; then
            replay_fallback_args=""
            if [[ "$${CRYPTO_1H_CURRENT_REPLAY_JOINED_FALLBACK_ENABLED:-true}" != "true" ]]; then
              replay_fallback_args="--skip-joined-fallback"
            fi
            for asset in $$assets; do
              echo "refreshing $$asset 1h non-model touch20 replay/gate evaluation" >&2
              if ! kalshi-bot-cli crypto-non-model-touch20 replay \
                --kalshi-env production \
                --frequency 1h \
                --asset "$$asset" \
                --days "$${CRYPTO_1H_CURRENT_REPLAY_GATE_DAYS:-30}" \
                --limit "$${CRYPTO_1H_CURRENT_REPLAY_GATE_LIMIT:-50000}" \
                $$replay_fallback_args \
                --json; then
                echo "$$asset 1h non-model touch20 evaluation replay refresh failed" >&2
              elif ! kalshi-bot-cli crypto-non-model-touch20 gate \
                --kalshi-env production \
                --frequency 1h \
                --asset "$$asset" \
                --json; then
                echo "$$asset 1h non-model touch20 evaluation gate refresh failed" >&2
              fi
            done
          fi
          sleep "$${CRYPTO_1H_CURRENT_INTERVAL_SECONDS:-0}"
        done
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: ${CRYPTO_1H_CURRENT_APP_COLOR:-blue}
