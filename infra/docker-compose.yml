services:
  postgres_demo:
    <<: [*cpu-limits, *oom-protect]
    image: pgvector/pgvector:pg16
    env_file: [../.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalshi_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kalshi_bot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_DEMO_PORT:-5432}:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data

  postgres_production:
    <<: [*cpu-limits, *oom-protect]
    image: pgvector/pgvector:pg16
    env_file: [../.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalshi_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    command: >
      postgres
      -c shared_buffers=4GB
      -c work_mem=32MB
      -c maintenance_work_mem=1GB
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kalshi_bot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PRODUCTION_PORT:-5433}:5432"
    volumes:
      - postgres_production_data:/var/lib/postgresql/data

  migrate_demo:
    <<: *build
    command: ["alembic", "upgrade", "head"]
    env_file: [../.env]
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
    volumes: *demo-key-volumes
    depends_on:
      postgres_demo:
        condition: service_healthy
    restart: "no"

  migrate_production:
    <<: *build
    command: ["alembic", "upgrade", "head"]
    env_file: [../.env]
    environment:
      <<: *production-env
      KALSHI_ENV: production
    volumes: *production-key-volumes
    depends_on:
      postgres_production:
        condition: service_healthy
    restart: "no"

  app_demo_blue:
    <<: [*demo-app-base, *gpu-access]
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
      APP_COLOR: blue

  app_demo_green:
    <<: [*demo-app-base, *gpu-access]
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
      APP_COLOR: green

  app_production_blue:
    <<: *production-app-base
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: blue

  app_production_green:
    <<: *production-app-base
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: green

  daemon_demo_blue:
    <<: [*demo-daemon-base, *gpu-access]
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
      APP_COLOR: blue
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  daemon_demo_green:
    <<: [*demo-daemon-base, *gpu-access]
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
      APP_COLOR: green
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  daemon_production_blue:
    <<: *production-daemon-base
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: blue
      CRYPTO_MODEL_NIGHTLY_AUTO_ENABLED: "false"
      CRYPTO_QUOTE_EVIDENCE_ENABLED: "false"
      CRYPTO_SPOT_CURRENT_AUTO_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  daemon_production_green:
    <<: *production-daemon-base
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: green
      CRYPTO_MODEL_NIGHTLY_AUTO_ENABLED: "false"
      CRYPTO_QUOTE_EVIDENCE_ENABLED: "false"
      CRYPTO_SPOT_CURRENT_AUTO_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  # Dedicated training node: owns the GPU + cores 4-7, runs ONLY the nightly
  # model-training scheduler (no trading/autonomy/exits/streaming). Writes model
  # artifacts + replay gates to the shared DB that the live daemons read. Sized
  # to leave cores 0-3 + all live-trading work isolated on the prod half.
  trainer_production:
    # cpu-trainer first so its cpuset wins the merge (YAML <<: earlier entries
    # take precedence) over the prod cpuset carried by production-daemon-base.
    <<: [*cpu-trainer, *gpu-access, *production-daemon-base]
    command: ["python", "-m", "kalshi_bot.cli", "daemon", "--training-node"]
    # Override the inherited -900 protection: the trainer is NOT trading-critical,
    # so it should be the kernel's first victim under host pressure. mem_limit caps
    # its cgroup so a runaway materialize/booster build self-limits (cgroup-OOM +
    # restart) instead of starving the host. 32g leaves ~30g for the live stack,
    # Postgres page cache, and headroom on this 62g box.
    oom_score_adj: 500
    mem_limit: 32g
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: trainer
      CRYPTO_TRAINING_NODE: "true"
      CRYPTO_MODEL_NIGHTLY_AUTO_ENABLED: "true"
      CRYPTO_XGBOOST_DEVICE: cuda
      # Asset-parallel cold rebuild across the dedicated cores (cpuset 4-7,12-15).
      # 7 assets over 4 workers ~= 2 waves; spawn start method (no fork deadlock).
      CRYPTO_TRAIN_BUILD_WORKERS: "4"
      # Triple-guard: a trainer must never place orders.
      CRYPTO_AUTONOMY_ENABLED: "false"
      CRYPTO_TRADING_ENABLED: "false"
      APP_SHADOW_MODE: "true"
      APP_ENABLE_KILL_SWITCH: "true"
      # Continuous collectors stay on the live daemons; the nightly refreshes its
      # own training window inline.
      CRYPTO_QUOTE_EVIDENCE_ENABLED: "false"
      CRYPTO_SPOT_CURRENT_AUTO_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  daemon_production_crypto_1h_blue:
    <<: *production-daemon-base
    command: ["python", "-m", "kalshi_bot.cli", "daemon", "--crypto-only", "--heartbeat-role", "crypto_1h"]
