      CRYPTO_MODEL_NIGHTLY_AUTO_ENABLED: "false"
      CRYPTO_AUTONOMY_ENABLED: "false"
      CRYPTO_PRODUCTION_AUTONOMY_ENABLED: "false"
      CRYPTO_TRADING_ENABLED: "false"
      CRYPTO_BTC15M_TOUCH20_RULES_ENABLED: ${PRODUCTION_CRYPTO_BTC15M_TOUCH20_RULES_ENABLED:-false}
      CRYPTO_BTC15M_TOUCH20_RULES_TRADING_ENABLED: ${PRODUCTION_CRYPTO_BTC15M_TOUCH20_RULES_TRADING_ENABLED:-false}
