services:
  postgres_demo:
    <<: *cpu-limits
    image: pgvector/pgvector:pg16
    env_file: [../.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalshi_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kalshi_bot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_DEMO_PORT:-5432}:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data

  postgres_production:
    <<: *cpu-limits
    image: pgvector/pgvector:pg16
    env_file: [../.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalshi_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    command: >
      postgres
      -c shared_buffers=4GB
      -c work_mem=32MB
      -c maintenance_work_mem=1GB
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kalshi_bot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PRODUCTION_PORT:-5433}:5432"
    volumes:
      - postgres_production_data:/var/lib/postgresql/data

  migrate_demo:
    <<: *build
    command: ["alembic", "upgrade", "head"]
    env_file: [../.env]
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
    volumes: *demo-key-volumes
    depends_on:
      postgres_demo:
        condition: service_healthy
    restart: "no"

  migrate_production:
    <<: *build
    command: ["alembic", "upgrade", "head"]
    env_file: [../.env]
    environment:
      <<: *production-env
      KALSHI_ENV: production
    volumes: *production-key-volumes
    depends_on:
      postgres_production:
        condition: service_healthy
    restart: "no"

  app_demo_blue:
    <<: *demo-app-base
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
      APP_COLOR: blue

  app_demo_green:
    <<: *demo-app-base
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
      APP_COLOR: green

  app_production_blue:
    <<: *production-app-base
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: blue

  app_production_green:
    <<: *production-app-base
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: green

  daemon_demo_blue:
    <<: *demo-daemon-base
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
      APP_COLOR: blue
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  daemon_demo_green:
    <<: *demo-daemon-base
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
      APP_COLOR: green
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  daemon_production_blue:
    <<: *production-daemon-base
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: blue
      CRYPTO_QUOTE_EVIDENCE_ENABLED: "false"
      CRYPTO_SPOT_CURRENT_AUTO_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  daemon_production_green:
    <<: *production-daemon-base
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: green
      CRYPTO_QUOTE_EVIDENCE_ENABLED: "false"
      CRYPTO_SPOT_CURRENT_AUTO_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  daemon_production_crypto_1h_blue:
    <<: *production-daemon-base
    command: ["python", "-m", "kalshi_bot.cli", "daemon", "--crypto-only", "--heartbeat-role", "crypto_1h"]
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: blue
      DAEMON_HEARTBEAT_ROLE: crypto_1h
      CRYPTO_AUTO_FREQUENCIES: "1h"
      CRYPTO_1H_ENABLED: ${CRYPTO_1H_ENABLED:-true}
      CRYPTO_HISTORY_AUTO_LOOKBACK_DAYS: ${CRYPTO_1H_HISTORY_DAYS:-7}
      CRYPTO_SPOT_HISTORY_AUTO_LOOKBACK_DAYS: ${CRYPTO_1H_SPOT_DAYS:-7}
      CRYPTO_AUTONOMY_ENABLED: ${PRODUCTION_CRYPTO_1H_AUTONOMY_ENABLED:-false}
      CRYPTO_PRODUCTION_AUTONOMY_ENABLED: ${PRODUCTION_CRYPTO_1H_PRODUCTION_AUTONOMY_ENABLED:-false}
      CRYPTO_TRADING_ENABLED: ${PRODUCTION_CRYPTO_1H_TRADING_ENABLED:-false}
      CRYPTO_MODEL_NIGHTLY_AUTO_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  daemon_production_crypto_1h_green:
    <<: *production-daemon-base
    command: ["python", "-m", "kalshi_bot.cli", "daemon", "--crypto-only", "--heartbeat-role", "crypto_1h"]
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: green
      DAEMON_HEARTBEAT_ROLE: crypto_1h
      CRYPTO_AUTO_FREQUENCIES: "1h"
      CRYPTO_1H_ENABLED: ${CRYPTO_1H_ENABLED:-true}
      CRYPTO_HISTORY_AUTO_LOOKBACK_DAYS: ${CRYPTO_1H_HISTORY_DAYS:-7}
      CRYPTO_SPOT_HISTORY_AUTO_LOOKBACK_DAYS: ${CRYPTO_1H_SPOT_DAYS:-7}
      CRYPTO_AUTONOMY_ENABLED: ${PRODUCTION_CRYPTO_1H_AUTONOMY_ENABLED:-false}
      CRYPTO_PRODUCTION_AUTONOMY_ENABLED: ${PRODUCTION_CRYPTO_1H_PRODUCTION_AUTONOMY_ENABLED:-false}
      CRYPTO_TRADING_ENABLED: ${PRODUCTION_CRYPTO_1H_TRADING_ENABLED:-false}
      CRYPTO_MODEL_NIGHTLY_AUTO_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  crypto_1h_production:
    <<: *production-daemon-base
    restart: "no"
    command:
      - bash
      - -lc
      - |
        if [[ "${CRYPTO_LIVE_PATH_REFRESH_ENABLED:-false}" != "true" ]]; then
          echo "legacy 1h crypto live-path refresh disabled; set CRYPTO_LIVE_PATH_REFRESH_ENABLED=true to opt in" >&2
          exit 0
        fi
        while true; do
          echo "starting 1h crypto live-path refresh" >&2
          if ! scripts/crypto_live_path_refresh.sh \
            --kalshi-env production \
            --frequency 1h \
            --settled-days "${CRYPTO_1H_SETTLED_DAYS:-7}" \
            --history-days "${CRYPTO_1H_HISTORY_DAYS:-7}" \
            --spot-days "${CRYPTO_1H_SPOT_DAYS:-7}" \
            --replay-days "${CRYPTO_1H_REPLAY_DAYS:-30}" \
            --out-dir "${CRYPTO_1H_REPORT_DIR:-/app/data/training/reports/crypto_live_path/1h}"; then
            echo "1h crypto live-path refresh failed" >&2
          fi
          sleep "${CRYPTO_1H_REFRESH_INTERVAL_SECONDS:-86400}"
        done
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: ${CRYPTO_1H_APP_COLOR:-blue}
      CLI: ${CRYPTO_1H_CLI:-python -m kalshi_bot.cli}
      CRYPTO_AUTO_FREQUENCIES: "1h"
      CRYPTO_1H_ENABLED: ${CRYPTO_1H_ENABLED:-true}
      CRYPTO_AUTONOMY_ENABLED: ${PRODUCTION_CRYPTO_1H_AUTONOMY_ENABLED:-false}
      CRYPTO_PRODUCTION_AUTONOMY_ENABLED: ${PRODUCTION_CRYPTO_1H_PRODUCTION_AUTONOMY_ENABLED:-false}
      CRYPTO_TRADING_ENABLED: ${PRODUCTION_CRYPTO_1H_TRADING_ENABLED:-false}

  crypto_current_production:
    <<: *production-daemon-base
    command:
      - bash
      - -lc
      - |
        while true; do
          echo "starting crypto current collection" >&2
          if ! kalshi-bot-cli crypto-history collect-open \
            --kalshi-env production \
            --frequency 15m \
            --assets BNB BTC DOGE ETH HYPE SOL XRP \
            --json; then
            echo "crypto current quote collection failed" >&2
          fi
          if ! kalshi-bot-cli crypto-spot collect-current \
            --kalshi-env production \
            --frequency 15m \
            --assets BNB BTC DOGE ETH HYPE SOL XRP \
            --json; then
            echo "crypto current spot collection failed" >&2
          fi
          sleep 15
        done
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: ${CRYPTO_CURRENT_APP_COLOR:-green}
      CRYPTO_AUTO_FREQUENCIES: "15m"
      CRYPTO_HISTORY_AUTO_ENABLED: "false"
      CRYPTO_SPOT_HISTORY_AUTO_ENABLED: "false"
      CRYPTO_MODEL_NIGHTLY_AUTO_ENABLED: "false"
      CRYPTO_AUTONOMY_ENABLED: "false"
      CRYPTO_PRODUCTION_AUTONOMY_ENABLED: "false"
      CRYPTO_TRADING_ENABLED: "false"

  web_demo:
    <<: *demo-app-base
    environment:
      <<: *demo-web-env
      APP_COLOR: ${WEB_DEMO_APP_COLOR:-${WEB_APP_COLOR:-blue}}
      KALSHI_ENV: demo
      WEB_SITE_KIND: demo

  web_production:
    <<: *production-app-base
    environment:
      <<: *production-web-env
      APP_COLOR: ${WEB_PRODUCTION_APP_COLOR:-${WEB_APP_COLOR:-blue}}
      KALSHI_ENV: production
      WEB_SITE_KIND: production

  web_strategies:
    <<: *demo-app-base
    environment:
      <<: *demo-web-env
      APP_COLOR: ${WEB_STRATEGIES_APP_COLOR:-${WEB_DEMO_APP_COLOR:-${WEB_APP_COLOR:-blue}}}
      KALSHI_ENV: demo
      WEB_SITE_KIND: strategies
      POSTGRES_SECONDARY_HOST: postgres_production
    depends_on:
      postgres_demo:
        condition: service_healthy
      postgres_production:
        condition: service_healthy

  caddy:
    <<: *cpu-limits
    image: caddy:2.9-alpine
    env_file: [../.env]
    environment:
      WEB_PUBLIC_HOST: ${WEB_PUBLIC_HOST:-home.kb-trade.trade}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-m7.ga.77@gmail.com}
    depends_on:
      - web_production
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_demo_data:
  postgres_production_data:
  caddy_data:
  caddy_config:
  training_data:
