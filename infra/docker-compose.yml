x-build: &build
  image: ${KALSHI_BOT_IMAGE:-kalshi-bot:local}
  build:
    context: ..
    dockerfile: infra/docker/Dockerfile

x-cpu-limits: &cpu-limits
  cpuset: "1-7"

x-common-env-base: &common-env-base
  APP_AUTO_INIT_DB: ${APP_AUTO_INIT_DB:-false}
  APP_ENABLE_KILL_SWITCH: ${APP_ENABLE_KILL_SWITCH:-true}
  STREAM_ORDERBOOK_PERSIST_INTERVAL_SECONDS: ${STREAM_ORDERBOOK_PERSIST_INTERVAL_SECONDS:-1.0}
  DAEMON_MARKET_UPDATE_THROTTLE_SECONDS: ${DAEMON_MARKET_UPDATE_THROTTLE_SECONDS:-2.0}
  DAEMON_ACTIVE_COLOR_CACHE_SECONDS: ${DAEMON_ACTIVE_COLOR_CACHE_SECONDS:-5.0}
  DAEMON_STARTUP_GRACE_SECONDS: ${DAEMON_STARTUP_GRACE_SECONDS:-30}
  DAEMON_STARTUP_JITTER_SECONDS: ${DAEMON_STARTUP_JITTER_SECONDS:-45}
  CRYPTO_AUTONOMY_INTERVAL_SECONDS: ${CRYPTO_AUTONOMY_INTERVAL_SECONDS:-60}
  CRYPTO_AUTONOMY_MIN_SECONDS_TO_CLOSE: ${CRYPTO_AUTONOMY_MIN_SECONDS_TO_CLOSE:-120}
  CRYPTO_AUTONOMY_MAX_ROOMS_PER_RUN: ${CRYPTO_AUTONOMY_MAX_ROOMS_PER_RUN:-7}
  CRYPTO_AUTONOMY_MAX_PER_ASSET_PER_RUN: ${CRYPTO_AUTONOMY_MAX_PER_ASSET_PER_RUN:-1}
  CRYPTO_SPOT_HISTORY_AUTO_ENABLED: ${CRYPTO_SPOT_HISTORY_AUTO_ENABLED:-true}
  CRYPTO_SPOT_HISTORY_AUTO_LOOKBACK_DAYS: ${CRYPTO_SPOT_HISTORY_AUTO_LOOKBACK_DAYS:-2}
  CRYPTO_REPLAY_MIN_SPOT_COVERAGE_PCT: ${CRYPTO_REPLAY_MIN_SPOT_COVERAGE_PCT:-0.80}
  MONOTONICITY_ARB_ENABLED: ${MONOTONICITY_ARB_ENABLED:-false}
  MONOTONICITY_ARB_SHADOW_ONLY: ${MONOTONICITY_ARB_SHADOW_ONLY:-true}
  WEATHER_SOURCE_ENSEMBLE_ENABLED: ${WEATHER_SOURCE_ENSEMBLE_ENABLED:-true}
  WEATHER_SOURCE_DISAGREEMENT_WIDEN_F: ${WEATHER_SOURCE_DISAGREEMENT_WIDEN_F:-3.0}
  WEATHER_SOURCE_DISAGREEMENT_STAND_DOWN_F: ${WEATHER_SOURCE_DISAGREEMENT_STAND_DOWN_F:-8.0}
  WEATHER_SOURCE_DISAGREEMENT_SIGMA_MULTIPLIER_MAX: ${WEATHER_SOURCE_DISAGREEMENT_SIGMA_MULTIPLIER_MAX:-2.0}
  WEATHER_NOWCAST_HIGH_SO_FAR_ENABLED: ${WEATHER_NOWCAST_HIGH_SO_FAR_ENABLED:-true}
  WEATHER_RESIDUAL_MIN_MAE_IMPROVEMENT_PCT: ${WEATHER_RESIDUAL_MIN_MAE_IMPROVEMENT_PCT:-0.02}
  WEATHER_RESIDUAL_MIN_CRPS_IMPROVEMENT_PCT: ${WEATHER_RESIDUAL_MIN_CRPS_IMPROVEMENT_PCT:-0.0}
  WEATHER_RESIDUAL_MIN_BRIER_IMPROVEMENT_PCT: ${WEATHER_RESIDUAL_MIN_BRIER_IMPROVEMENT_PCT:-0.0}
  WEATHER_RESIDUAL_MODEL_MAX_AGE_HOURS: ${WEATHER_RESIDUAL_MODEL_MAX_AGE_HOURS:-168}
  WEATHER_INTRADAY_MODEL_MAX_AGE_HOURS: ${WEATHER_INTRADAY_MODEL_MAX_AGE_HOURS:-168}
  WEATHER_INTRADAY_MIN_TRAIN_ROWS: ${WEATHER_INTRADAY_MIN_TRAIN_ROWS:-500}
  WEATHER_INTRADAY_MIN_HOLDOUT_ROWS: ${WEATHER_INTRADAY_MIN_HOLDOUT_ROWS:-100}
  WEATHER_INTRADAY_MIN_BRIER_IMPROVEMENT_PCT: ${WEATHER_INTRADAY_MIN_BRIER_IMPROVEMENT_PCT:-0.01}
  WEATHER_INTRADAY_MAX_CALIBRATION_ERROR: ${WEATHER_INTRADAY_MAX_CALIBRATION_ERROR:-0.20}
  WEATHER_INTRADAY_MIN_CALIBRATION_BUCKET_ROWS: ${WEATHER_INTRADAY_MIN_CALIBRATION_BUCKET_ROWS:-50}
  WEATHER_INTRADAY_MIN_SERIES_HOLDOUT_ROWS: ${WEATHER_INTRADAY_MIN_SERIES_HOLDOUT_ROWS:-30}
  WEATHER_INTRADAY_MAX_SERIES_BRIER_REGRESSION: ${WEATHER_INTRADAY_MAX_SERIES_BRIER_REGRESSION:-0.05}
  SIGMA_CALIBRATION_ENABLED: ${SIGMA_CALIBRATION_ENABLED:-true}
  SIGMA_MIN_SAMPLES_BEATS_GLOBAL: ${SIGMA_MIN_SAMPLES_BEATS_GLOBAL:-100}
  SIGMA_MIN_SAMPLES_BEATS_YAML: ${SIGMA_MIN_SAMPLES_BEATS_YAML:-200}
  SIGMA_MIN_CRPS_IMPROVEMENT: ${SIGMA_MIN_CRPS_IMPROVEMENT:-0.0}
  SIGMA_LEAD_CORRECTION_ENABLED: ${SIGMA_LEAD_CORRECTION_ENABLED:-true}
  CODEX_AUTH_JSON_PATH: ${CODEX_AUTH_JSON_PATH_CONTAINER:-/root/.codex/auth.json}
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-kalshi_bot}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}

x-demo-env: &demo-env
  <<: *common-env-base
  APP_SHADOW_MODE: ${DEMO_APP_SHADOW_MODE:-true}
  TRIGGER_ENABLE_AUTO_ROOMS: ${DEMO_TRIGGER_ENABLE_AUTO_ROOMS:-false}
  STRATEGY_C_ENABLED: ${DEMO_STRATEGY_C_ENABLED:-false}
  STRATEGY_C_SHADOW_ONLY: ${DEMO_STRATEGY_C_SHADOW_ONLY:-true}
  CRYPTO_AUTONOMY_ENABLED: ${DEMO_CRYPTO_AUTONOMY_ENABLED:-false}
  CRYPTO_PRODUCTION_AUTONOMY_ENABLED: false
  CRYPTO_TRADING_ENABLED: ${DEMO_CRYPTO_TRADING_ENABLED:-false}
  WEATHER_PREDICTION_ENABLED: ${DEMO_WEATHER_PREDICTION_ENABLED:-false}
  WEATHER_RESIDUAL_MODEL_ENABLED: ${DEMO_WEATHER_RESIDUAL_MODEL_ENABLED:-false}
  WEATHER_INTRADAY_MODEL_ENABLED: ${DEMO_WEATHER_INTRADAY_MODEL_ENABLED:-false}
  POSTGRES_HOST: postgres_demo
  DEMO_KALSHI_READ_PRIVATE_KEY_PATH: ${DEMO_KALSHI_KEY_PATH_CONTAINER:-/run/secrets/kalshi-demo.pem}
  DEMO_KALSHI_WRITE_PRIVATE_KEY_PATH: ${DEMO_KALSHI_KEY_PATH_CONTAINER:-/run/secrets/kalshi-demo.pem}

x-production-env: &production-env
  <<: *common-env-base
  APP_SHADOW_MODE: ${PRODUCTION_APP_SHADOW_MODE:-true}
  TRIGGER_ENABLE_AUTO_ROOMS: ${PRODUCTION_TRIGGER_ENABLE_AUTO_ROOMS:-false}
  STRATEGY_C_ENABLED: ${PRODUCTION_STRATEGY_C_ENABLED:-false}
  STRATEGY_C_SHADOW_ONLY: ${PRODUCTION_STRATEGY_C_SHADOW_ONLY:-true}
  CRYPTO_AUTONOMY_ENABLED: ${PRODUCTION_CRYPTO_AUTONOMY_ENABLED:-false}
  CRYPTO_PRODUCTION_AUTONOMY_ENABLED: ${PRODUCTION_CRYPTO_PRODUCTION_AUTONOMY_ENABLED:-false}
  CRYPTO_TRADING_ENABLED: ${PRODUCTION_CRYPTO_TRADING_ENABLED:-false}
  WEATHER_PREDICTION_ENABLED: ${PRODUCTION_WEATHER_PREDICTION_ENABLED:-false}
  WEATHER_RESIDUAL_MODEL_ENABLED: ${PRODUCTION_WEATHER_RESIDUAL_MODEL_ENABLED:-false}
  WEATHER_INTRADAY_MODEL_ENABLED: ${PRODUCTION_WEATHER_INTRADAY_MODEL_ENABLED:-false}
  POSTGRES_HOST: postgres_production
  LIVE_KALSHI_READ_PRIVATE_KEY_PATH: ${LIVE_KALSHI_KEY_PATH_CONTAINER:-/run/secrets/kalshi-live.pem}
  LIVE_KALSHI_WRITE_PRIVATE_KEY_PATH: ${LIVE_KALSHI_KEY_PATH_CONTAINER:-/run/secrets/kalshi-live.pem}

x-demo-web-env: &demo-web-env
  <<: *demo-env
  WEB_DEMO_HOST: ${WEB_DEMO_HOST:-demo.ai-al.site}
  WEB_PRODUCTION_HOST: ${WEB_PRODUCTION_HOST:-prod.ai-al.site}
  WEB_STRATEGIES_HOST: ${WEB_STRATEGIES_HOST:-strategy.ai-al.site}
  WEB_AUTH_COOKIE_DOMAIN: ${WEB_AUTH_COOKIE_DOMAIN:-.ai-al.site}

x-production-web-env: &production-web-env
  <<: *production-env
  WEB_DEMO_HOST: ${WEB_DEMO_HOST:-demo.ai-al.site}
  WEB_PRODUCTION_HOST: ${WEB_PRODUCTION_HOST:-prod.ai-al.site}
  WEB_STRATEGIES_HOST: ${WEB_STRATEGIES_HOST:-strategy.ai-al.site}
  WEB_AUTH_COOKIE_DOMAIN: ${WEB_AUTH_COOKIE_DOMAIN:-.ai-al.site}

x-demo-key-volumes: &demo-key-volumes
  - ${DEMO_KALSHI_KEY_PATH_HOST:-../Kalshi-2-Demo.txt}:${DEMO_KALSHI_KEY_PATH_CONTAINER:-/run/secrets/kalshi-demo.pem}:ro

x-production-key-volumes: &production-key-volumes
  - ${LIVE_KALSHI_KEY_PATH_HOST:-../Kalshi-1.txt}:${LIVE_KALSHI_KEY_PATH_CONTAINER:-/run/secrets/kalshi-live.pem}:ro

x-codex-volumes: &codex-volumes
  - ${CODEX_HOME_HOST:-/root/.codex}:${CODEX_HOME_CONTAINER:-/root/.codex}:ro

x-app-common: &app-common
  <<: [*build, *cpu-limits]
  env_file: [../.env]
  expose: ["8000"]
  volumes: *codex-volumes
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=30).read()"]
    interval: 60s
    timeout: 60s
    retries: 3
    start_period: 90s
  restart: unless-stopped

x-demo-app-base: &demo-app-base
  <<: *app-common
  volumes:
    - ${DEMO_KALSHI_KEY_PATH_HOST:-../Kalshi-2-Demo.txt}:${DEMO_KALSHI_KEY_PATH_CONTAINER:-/run/secrets/kalshi-demo.pem}:ro
    - ${CODEX_HOME_HOST:-/root/.codex}:${CODEX_HOME_CONTAINER:-/root/.codex}:ro
  depends_on:
    postgres_demo:
      condition: service_healthy
    migrate_demo:
      condition: service_completed_successfully

x-production-app-base: &production-app-base
  <<: *app-common
  volumes:
    - ${LIVE_KALSHI_KEY_PATH_HOST:-../Kalshi-1.txt}:${LIVE_KALSHI_KEY_PATH_CONTAINER:-/run/secrets/kalshi-live.pem}:ro
    - ${CODEX_HOME_HOST:-/root/.codex}:${CODEX_HOME_CONTAINER:-/root/.codex}:ro
  depends_on:
    postgres_production:
      condition: service_healthy
    migrate_production:
      condition: service_completed_successfully

x-daemon-common: &daemon-common
  <<: [*build, *cpu-limits]
  command: ["python", "-m", "kalshi_bot.cli", "daemon"]
  env_file: [../.env]
  volumes: *codex-volumes
  restart: unless-stopped

x-demo-daemon-base: &demo-daemon-base
  <<: *daemon-common
  volumes:
    - ${DEMO_KALSHI_KEY_PATH_HOST:-../Kalshi-2-Demo.txt}:${DEMO_KALSHI_KEY_PATH_CONTAINER:-/run/secrets/kalshi-demo.pem}:ro
    - ${CODEX_HOME_HOST:-/root/.codex}:${CODEX_HOME_CONTAINER:-/root/.codex}:ro
  depends_on:
    postgres_demo:
      condition: service_healthy
    migrate_demo:
      condition: service_completed_successfully

x-production-daemon-base: &production-daemon-base
  <<: *daemon-common
  volumes:
    - ${LIVE_KALSHI_KEY_PATH_HOST:-../Kalshi-1.txt}:${LIVE_KALSHI_KEY_PATH_CONTAINER:-/run/secrets/kalshi-live.pem}:ro
    - ${CODEX_HOME_HOST:-/root/.codex}:${CODEX_HOME_CONTAINER:-/root/.codex}:ro
  depends_on:
    postgres_production:
      condition: service_healthy
    migrate_production:
      condition: service_completed_successfully

services:
  postgres_demo:
    <<: *cpu-limits
    image: pgvector/pgvector:pg16
    env_file: [../.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalshi_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kalshi_bot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_DEMO_PORT:-5432}:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data

  postgres_production:
    <<: *cpu-limits
    image: pgvector/pgvector:pg16
    env_file: [../.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalshi_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kalshi_bot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PRODUCTION_PORT:-5433}:5432"
    volumes:
      - postgres_production_data:/var/lib/postgresql/data

  migrate_demo:
    <<: *build
    command: ["alembic", "upgrade", "head"]
    env_file: [../.env]
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
    volumes: *demo-key-volumes
    depends_on:
      postgres_demo:
        condition: service_healthy
    restart: "no"

  migrate_production:
    <<: *build
    command: ["alembic", "upgrade", "head"]
    env_file: [../.env]
    environment:
      <<: *production-env
      KALSHI_ENV: production
    volumes: *production-key-volumes
    depends_on:
      postgres_production:
        condition: service_healthy
    restart: "no"

  app_demo_blue:
    <<: *demo-app-base
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
      APP_COLOR: blue

  app_demo_green:
    <<: *demo-app-base
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
      APP_COLOR: green

  app_production_blue:
    <<: *production-app-base
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: blue

  app_production_green:
    <<: *production-app-base
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: green

  daemon_demo_blue:
    <<: *demo-daemon-base
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
      APP_COLOR: blue
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  daemon_demo_green:
    <<: *demo-daemon-base
    environment:
      <<: *demo-env
      KALSHI_ENV: demo
      APP_COLOR: green
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  daemon_production_blue:
    <<: *production-daemon-base
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: blue
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  daemon_production_green:
    <<: *production-daemon-base
    environment:
      <<: *production-env
      KALSHI_ENV: production
      APP_COLOR: green
    healthcheck:
      test: ["CMD", "python", "-m", "kalshi_bot.docker_healthcheck", "daemon"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 120s

  web_demo:
    <<: *demo-app-base
    environment:
      <<: *demo-web-env
      APP_COLOR: ${WEB_APP_COLOR:-blue}
      KALSHI_ENV: demo
      WEB_SITE_KIND: demo

  web_production:
    <<: *production-app-base
    environment:
      <<: *production-web-env
      APP_COLOR: ${WEB_APP_COLOR:-blue}
      KALSHI_ENV: production
      WEB_SITE_KIND: production

  web_strategies:
    <<: *demo-app-base
    environment:
      <<: *demo-web-env
      APP_COLOR: ${WEB_APP_COLOR:-blue}
      KALSHI_ENV: demo
      WEB_SITE_KIND: strategies
      POSTGRES_SECONDARY_HOST: postgres_production
    depends_on:
      postgres_demo:
        condition: service_healthy
      postgres_production:
        condition: service_healthy

  caddy:
    <<: *cpu-limits
    image: caddy:2.9-alpine
    env_file: [../.env]
    environment:
      WEB_DEMO_HOST: ${WEB_DEMO_HOST:-demo.ai-al.site}
      WEB_PRODUCTION_HOST: ${WEB_PRODUCTION_HOST:-prod.ai-al.site}
      WEB_STRATEGIES_HOST: ${WEB_STRATEGIES_HOST:-strategy.ai-al.site}
    depends_on:
      - web_demo
      - web_production
      - web_strategies
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_demo_data:
  postgres_production_data:
  caddy_data:
  caddy_config:
